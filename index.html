<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Лапкакоин: котики-тапалка</title>
<style>
:root{--bg:#fff6ee;--card:#fff;--tx:#3b2a22;--mut:#8a7468;--ac:#ff8a4c;--ac2:#ffd36e;--bd:#f1dccb;--ok:#3aa56b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1613;--card:#2a201b;--tx:#f6e8dd;--mut:#b09c8f;--bd:#43332a;--ac:#ff9a5c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;user-select:none}
.wrap{max-width:560px;margin:0 auto;padding:14px}
h1{margin:4px 0 10px;font-size:20px;text-align:center}
.bal{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#3b2a22;border-radius:18px;padding:12px;text-align:center}
.bal b{font-size:34px;display:block;line-height:1.1}
.bal span{font-size:13px;opacity:.85}
.stage{position:relative;height:250px;display:flex;align-items:center;justify-content:center;overflow:hidden;isolation:isolate;border-radius:18px}
#cat{font-size:150px;line-height:1;padding:10px;border-radius:50%;cursor:pointer;transition:transform .08s;touch-action:manipulation;filter:drop-shadow(0 8px 10px rgba(0,0,0,.2))}
#cat.p{transform:scale(.88) rotate(-4deg)}
.fl{position:absolute;font-weight:800;font-size:22px;color:var(--ac);pointer-events:none;animation:up .8s ease-out forwards;text-shadow:0 1px 0 var(--card)}
@keyframes up{to{transform:translateY(-90px);opacity:0}}
.fl.crit{color:#ffc400;font-size:32px;animation-duration:1.1s;text-shadow:0 0 10px #ff9500,0 2px 0 #7a4a00;z-index:5}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.tabs button{flex:1 1 30%;padding:9px 2px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font:inherit;font-size:13px;font-weight:700}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.it{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;margin-bottom:8px}
.it .ic{font-size:30px;width:40px;text-align:center}
.it .in{flex:1;min-width:0;font-size:14px}
.it .in small{display:block;color:var(--mut);font-size:12px}
.it button{border:0;border-radius:10px;padding:9px 12px;background:var(--ok);color:#fff;font:inherit;font-size:13px;font-weight:800;white-space:nowrap}
.it button.no{background:var(--bd);color:var(--mut)}
.it button.eq{background:var(--ac)}
.fish{position:absolute;left:-60px;top:14px;font-size:46px;cursor:pointer;z-index:3;animation:swim 6s linear forwards;filter:drop-shadow(0 0 12px #ffc83a)}
@keyframes swim{50%{transform:translateY(70px) rotate(8deg)}to{left:calc(100% + 10px);transform:translateY(10px)}}
.note{position:absolute;left:8px;right:8px;top:6px;text-align:center;font-weight:800;font-size:14px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px;z-index:4;pointer-events:none;animation:nt 4s forwards}
@keyframes nt{75%{opacity:1}to{opacity:0}}
.mbar{position:relative;height:22px;border-radius:11px;background:var(--bd);overflow:hidden;margin:2px 0 6px}
.mbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--ac2),var(--ac))}
.mbar span{position:relative;display:block;text-align:center;font-size:12px;font-weight:800;line-height:22px}
.crew{position:absolute;left:0;right:0;bottom:2px;display:flex;justify-content:center;gap:8px;pointer-events:none}
.cr{position:relative;font-size:28px;line-height:1;animation:bob 1.6s ease-in-out infinite}
.cr:nth-child(even){animation-delay:.5s}
.cr i{position:absolute;right:-8px;top:-8px;font-style:normal;font-size:10px;font-weight:800;background:var(--ac);color:#fff;border-radius:8px;padding:1px 4px}
@keyframes bob{50%{transform:translateY(-6px)}}
.cr.buff{filter:drop-shadow(0 0 8px #ffd35a)}
.care{position:absolute;left:50%;top:-34px;transform:translateX(-50%);font-size:24px;line-height:1;pointer-events:auto;cursor:pointer;font-style:normal;animation:bob 1s ease-in-out infinite;padding:6px}
.reset{display:block;margin:14px auto 0;background:none;border:0;color:var(--mut);font:inherit;font-size:12px;text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <h1>🐾 Котики и лапкакоины</h1>
  <div style="text-align:center;margin:-2px 0 8px"><button id="meow" onclick="meowGo()" style="border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 14px;font:inherit;font-size:12px;font-weight:800"></button></div>
  <div class="bal"><b id="coins">0</b><span id="stats"></span></div>
  <div id="eqline" style="font-size:12px;text-align:center;color:var(--mut);margin-top:6px"></div>
  <div class="stage" id="stage"><div id="bgd" style="position:absolute;inset:0;pointer-events:none;font-size:24px;opacity:.65;z-index:-1"></div><div id="cat">😺</div><div class="crew" id="crew"></div></div>
  <div class="mbar"><i id="mb"></i><span id="ml">Мурр-режим: тапай быстрее!</span></div>
  <div class="tabs" id="tabs"></div>
  <div id="list"></div>
  <div style="text-align:center;margin-top:14px"><input id="code" maxlength="12" placeholder="секретный код" style="width:140px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:7px;font:inherit;font-size:13px;text-transform:uppercase"> <button onclick="useCode()" style="border:0;background:var(--ac);color:#fff;border-radius:10px;padding:8px 12px;font:inherit;font-weight:800;font-size:13px">OK</button></div>
  <button class="reset" onclick="resetGame()">Сбросить прогресс</button>
</div>

  var mb=document.getElementById("mb");
  mb.style.width=(en*100)+"%";mb.style.background=CCOL[lv];
  document.getElementById("ml").textContent=lv>0?"🔥 Комбо ×"+String(COMBO[lv]).replace(".",",")+" · ур. "+lv+(lv==COMBO.length-1?" · МАКС":""):"Тапай быстрее: разгоняй комбо!";
  cat.style.filter=lv>0?"drop-shadow(0 6px "+(10+lv*4)+"px "+CCOL[lv]+")":"";frameFx();
  refresh();
},100);
setInterval(save,5000);
function note(t){var n=document.createElement("div");n.className="note";n.textContent=t;stage.appendChild(n);setTimeout(function(){n.remove()},4000);}
var FISH=[["🐟","Обычная рыбка",3,40,"#9ad7ff"],["🐠","Золотая рыбка",10,30,"#ffc83a"],["🐡","Королевская рыбка",28,20,"#ff5ca8"],["🐳","Кит",70,10,"#4d7bff"]];
function spawnFish(){if(fr){setTimeout(spawnFish,8000);return;}
  var rare=1+bon("rare")+bon("luck"),w=FISH.map(function(x,j){return x[3]*(j>1?rare:1)}),sum=w.reduce(function(a,b){return a+b},0),r=Math.random()*sum,i=0;
  while(i<w.length-1&&r>=w[i]){r-=w[i];i++}
  var k=FISH[i],f=document.createElement("div"),life=6+bon("fl");
  f.className="fish";f.textContent=k[0];f.style.animationDuration=life+"s";f.style.fontSize=(44+i*6)+"px";f.style.filter="drop-shadow(0 0 12px "+k[4]+")";
  f.addEventListener("pointerdown",function(e){
    e.preventDefault();
    var b=k[2]*(pps()+basePower()*3)*(1+bon("fv"));S.c+=b;S.t+=b;S.fish++;hapAdd(8);
    f.remove();S.m[i+1]++;note((f.dataset.auto?"🎣 Авто-рыбак: ":"")+k[0]+" "+k[1]+"! +"+fmt(b)+" и "+MAT[i+1][0]+" "+MAT[i+1][1]+" кристалл");if(tab==6)render();refresh();
  });
  stage.appendChild(f);setTimeout(function(){f.remove()},life*1000+100);
  if(Math.random()<0.2*S.tl[2])setTimeout(function(){if(f.parentNode){f.dataset.auto="1";f.dispatchEvent(new PointerEvent("pointerdown",{bubbles:true,cancelable:true}));}},1800);
  setTimeout(spawnFish,(25000+Math.random()*25000)/(1+bon("fq")+bon("luck")/2));
}
setTimeout(spawnFish,5000);
render();
if(S.ts){
  var sec=Math.min((Date.now()-S.ts)/1000,(8+2*S.tl[0])*3600),g=pps()*sec*(0.5+0.1*S.tl[1]);
  if(sec>30&&g>=1){S.c+=g;S.t+=g;note("😴 Пока тебя не было, котики намурчали +"+fmt(g));refresh();}
}
</script>
